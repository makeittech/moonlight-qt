name: Build Steam Deck Flatpak

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
      - 'cursor/**'
      - 'feature/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version (optional)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.local/share
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning
        submodules: recursive
    
    - name: Debug - List files
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Manifest file exists:"
        ls -la moonlight-steamdeck.yml || echo "Manifest file not found"
    
    - name: Setup Flatpak environment
      run: |
        echo "Setting up Flatpak environment..."
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        
        # Set up Flatpak environment variables
        export XDG_DATA_HOME="$HOME/.local/share"
        export XDG_CONFIG_HOME="$HOME/.config"
        export XDG_CACHE_HOME="$HOME/.cache"
        
        # Configure Flatpak for user installation
        flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        
        # Update remote list and refresh
        flatpak --user remote-list
        flatpak --user remote-info flathub org.kde.Platform//23.08
        
        # Refresh the remote to ensure it's properly configured
        flatpak --user remote-refresh flathub
        
        # Check available runtimes
        echo "Checking available KDE Platform runtimes..."
        flatpak --user remote-ls flathub | grep org.kde.Platform || echo "No KDE Platform runtimes found"
        flatpak --user remote-ls flathub | grep org.kde.Sdk || echo "No KDE SDK runtimes found"
        
        # Install required runtimes for user (using available versions)
        flatpak --user install --assumeyes org.kde.Platform//23.08 org.kde.Sdk//23.08 || true
        
        # Verify installation
        echo "Verifying Flatpak installation..."
        flatpak --user list | grep org.kde.Platform || echo "Warning: KDE Platform not found in user installation"
        flatpak --user list | grep org.kde.Sdk || echo "Warning: KDE SDK not found in user installation"
        
        echo "Flatpak setup complete"
    
    - name: Build Flatpak
      run: |
        echo "Building Flatpak package..."
        
        # Validate manifest file exists
        if [ ! -f "moonlight-steamdeck.yml" ]; then
          echo "❌ Error: moonlight-steamdeck.yml not found!"
          exit 1
        fi
        
        echo "✅ Manifest file found: moonlight-steamdeck.yml"
        
        # Create build directory
        mkdir -p build
        
        # Build the Flatpak (dependencies already installed)
        flatpak-builder \
          --force-clean \
          --user \
          --install-deps-from=flathub \
          --repo=repo \
          build \
          moonlight-steamdeck.yml
        
        echo "Build completed"
    
    - name: Create bundle
      run: |
        echo "Creating Flatpak bundle..."
        
        # Check if repo exists
        if [ ! -d "repo" ]; then
          echo "❌ Error: repo directory not found!"
          exit 1
        fi
        
        # Create bundle
        flatpak build-bundle repo moonlight-steamdeck.flatpak com.moonlight_stream.Moonlight
        
        echo "Bundle created"
    
    - name: Get version info
      id: version
      run: |
        if [ "${{ github.event.inputs.version }}" != "" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v6.1.0')-$(git rev-parse --short HEAD)-$(date +%Y%m%d)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    
    - name: Check build output
      run: |
        echo "Checking build output..."
        if [ -f moonlight-steamdeck.flatpak ]; then
          echo "✅ Flatpak build completed successfully"
          ls -la moonlight-steamdeck.flatpak
        else
          echo "❌ Flatpak build failed - output file not found"
          echo "Current directory contents:"
          ls -la
          exit 1
        fi
    
    - name: Rename artifact
      run: |
        mv moonlight-steamdeck.flatpak moonlight-steamdeck-${{ steps.version.outputs.version }}.flatpak
    
    - name: Create release notes
      run: |
        cat > "RELEASE_NOTES_${{ steps.version.outputs.version }}.md" << EOF
        # Moonlight Steam Deck Flatpak v${{ steps.version.outputs.version }}
        
        ## Release Information
        - **Version**: ${{ steps.version.outputs.version }}
        - **Build Date**: $(date)
        - **Git Commit**: $(git rev-parse --short HEAD)
        - **Git Tag**: $(git describe --tags --abbrev=0 2>/dev/null || echo "none")
        - **Build Type**: Steam Deck Optimized
        
        ## 🚀 New Features
        
        ### Auto-Reconnect
        - **Automatic reconnection** when connection is lost
        - **2 minutes of retry attempts** before showing error (24 retries)
        - **Visual feedback** showing reconnection progress
        - **Cancel anytime** with Ctrl+Alt+C keyboard shortcut
        
        ### Simplified Build Process
        - One-command build with \`make steamdeck\`
        - Automatic dependency installation
        - Clear progress indicators and instructions
        
        ## 📦 Installation Instructions
        
        ### Method 1: Via Terminal
        \`\`\`bash
        flatpak install --user moonlight-steamdeck-${{ steps.version.outputs.version }}.flatpak
        \`\`\`
        
        ### Method 2: Via Discover App
        1. Copy \`moonlight-steamdeck-${{ steps.version.outputs.version }}.flatpak\` to your Steam Deck
        2. Open Discover app
        3. Click on the file and select "Install"
        
        ### Method 3: Add to Steam
        1. Install using Method 1 or 2
        2. Open Steam in Desktop Mode
        3. Go to: Games → Add a Non-Steam Game to My Library
        4. Browse to \`/usr/bin/flatpak\`
        5. Set launch options to: \`run com.moonlight_stream.Moonlight\`
        
        ## 🎮 Steam Deck Optimizations
        - Enhanced gamepad support with Steam Deck controllers
        - Full hardware access (DRI, input devices, audio)
        - Steam virtual gamepad integration
        - Optimized for Steam Deck's display and audio systems
        - Low latency input handling
        
        ## ✨ Features
        - **Auto-reconnect for 2 minutes** when connection fails
        - Game streaming from NVIDIA GeForce Experience or Sunshine
        - Low latency streaming optimized for gaming
        - Full controller support with haptic feedback
        - 4K HDR streaming support
        - Audio streaming with 5.1/7.1 surround sound
        - Hardware-accelerated video decoding
        
        ## 💻 System Requirements
        - Steam Deck (or compatible Linux system with Flatpak support)
        - Stable network connection to host PC
        - Host PC running GeForce Experience (NVIDIA) or Sunshine
        - Recommended: 5GHz WiFi or Ethernet connection
        
        ## 🔧 Troubleshooting
        
        ### Connection Issues
        - If disconnected, the app will automatically retry for 2 minutes
        - Press **Ctrl+Alt+C** to cancel auto-reconnect
        - Ensure host PC is running and streaming software is active
        
        ### Installation Issues
        - Use \`--user\` flag if system installation fails
        - Ensure Flatpak is installed: \`sudo apt install flatpak\`
        - Add Flathub: \`flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo\`
        
        ### Performance Issues
        - Check network connectivity and latency
        - Verify firewall settings allow Moonlight traffic (ports 47984-47990, 48010)
        - Try Desktop Mode if Game Mode has issues
        - Disable VPN if active on either device
        
        ## 📚 Documentation
        - Quick Start Guide: See \`QUICK_START_STEAM_DECK.md\` in repository
        - Project Repository: https://github.com/moonlight-stream/moonlight-qt
        - Steam Deck Support: https://help.steampowered.com/
        
        ## 🙏 Support
        For support and bug reports, visit: https://github.com/moonlight-stream/moonlight-qt/issues
        EOF
    
    - name: Upload Flatpak artifact
      uses: actions/upload-artifact@v4
      with:
        name: moonlight-steamdeck-${{ steps.version.outputs.version }}
        path: |
          moonlight-steamdeck-${{ steps.version.outputs.version }}.flatpak
          RELEASE_NOTES_${{ steps.version.outputs.version }}.md
        retention-days: 30
    
    - name: Create Release (on tag or manual trigger)
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Moonlight Steam Deck v${{ steps.version.outputs.version }}
        files: |
          moonlight-steamdeck-${{ steps.version.outputs.version }}.flatpak
          RELEASE_NOTES_${{ steps.version.outputs.version }}.md
        body_path: RELEASE_NOTES_${{ steps.version.outputs.version }}.md
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build Summary
      run: |
        echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifact Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Filename**: moonlight-steamdeck-${{ steps.version.outputs.version }}.flatpak" >> $GITHUB_STEP_SUMMARY
        echo "- **Size**: $(du -h moonlight-steamdeck-${{ steps.version.outputs.version }}.flatpak | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 New Features" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Auto-reconnect for 2 minutes when connection fails" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Visual feedback during reconnection attempts" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Cancel auto-reconnect with Ctrl+Alt+C" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Steam Deck optimized build" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
        echo "The Flatpak package has been uploaded as an artifact and can be downloaded from the Actions tab." >> $GITHUB_STEP_SUMMARY
        if [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
          echo "A GitHub release has been created automatically." >> $GITHUB_STEP_SUMMARY
        fi