name: Test Steam Deck Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - fix-github-actions-build-validation
  pull_request:
    branches:
      - master
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.local/share
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Setup Flatpak environment
      run: |
        echo "Setting up Flatpak environment..."
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        
        # Set up Flatpak environment variables
        export XDG_DATA_HOME="$HOME/.local/share"
        export XDG_CONFIG_HOME="$HOME/.config"
        export XDG_CACHE_HOME="$HOME/.cache"
        
        # Configure Flatpak for user installation
        flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        
        # Update remote list
        flatpak --user remote-list
        
        # Check available runtimes
        echo "Checking available KDE Platform runtimes..."
        flatpak --user remote-ls flathub | grep "org.kde.Platform" | head -10 || echo "No KDE Platform runtimes found"
        flatpak --user remote-ls flathub | grep "org.kde.Sdk" | head -10 || echo "No KDE SDK runtimes found"
        
        # Install required runtimes for user (using version 6.8)
        echo "Installing KDE Platform 6.8 and SDK..."
        flatpak --user install --assumeyes flathub org.kde.Platform//6.8 org.kde.Sdk//6.8 || echo "Warning: Failed to install runtimes"
        
        # Verify installation
        echo "Verifying Flatpak installation..."
        flatpak --user list | grep org.kde.Platform || echo "Warning: KDE Platform not found in user installation"
        flatpak --user list | grep org.kde.Sdk || echo "Warning: KDE SDK not found in user installation"
        
        echo "Flatpak setup complete"
    
    - name: Build test Flatpak
      run: |
        echo "Building test Flatpak package..."
        
        # Validate manifest file exists
        if [ ! -f "moonlight-steamdeck.yml" ]; then
          echo "❌ Error: moonlight-steamdeck.yml not found!"
          exit 1
        fi
        
        echo "✅ Manifest file found: moonlight-steamdeck.yml"
        
        # Create build directory
        mkdir -p build-test
        
        # Build the Flatpak (dependencies already installed)
        flatpak-builder \
          --force-clean \
          --user \
          --install-deps-from=flathub \
          --repo=repo-test \
          build-test \
          moonlight-steamdeck.yml
        
        echo "Test build completed"
    
    - name: Create test bundle
      run: |
        echo "Creating test Flatpak bundle..."
        
        # Check if repo exists
        if [ ! -d "repo-test" ]; then
          echo "❌ Error: repo-test directory not found!"
          exit 1
        fi
        
        # Create bundle
        flatpak build-bundle repo-test moonlight-steamdeck-test.flatpak com.moonlight_stream.Moonlight
        
        echo "Test bundle created"
    
    - name: Test build completion
      run: |
        echo "✅ Build test completed successfully!"
        echo "📦 Flatpak bundle created: moonlight-steamdeck-test.flatpak"
        echo "🎮 Ready for Steam Deck installation"
        
        # Check file size
        if [ -f moonlight-steamdeck-test.flatpak ]; then
          size=$(du -h moonlight-steamdeck-test.flatpak | cut -f1)
          echo "📊 Bundle size: $size"
        else
          echo "❌ Bundle file not found!"
          exit 1
        fi
    
    - name: Upload test artifact
      uses: actions/upload-artifact@v4
      with:
        name: moonlight-steamdeck-test
        path: moonlight-steamdeck-test.flatpak
        retention-days: 7